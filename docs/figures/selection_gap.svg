<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" role="img" aria-labelledby="abfig-sel-wide-t abfig-sel-wide-d" class="ab-figsvg ab-fig-wide" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Nimbus Sans','Liberation Sans',sans-serif" fill="var(--ab-ink,#171b21)">
<title id="abfig-sel-wide-t">Top-k selection against output-optimal selection at a matched budget</title>
<desc id="abfig-sel-wide-d">Two curves of output error against the number of keys kept per query, on logarithmic axes. The upper curve is topk, which keeps the largest attention weights; the lower is value_topk, which keeps the keys that minimise output error. The shaded band between them is the cost of selecting on scores alone, and it does not close as the budget grows.</desc>
