     off, where MathJax does not run. Included by docs/index.md and by
     docs/gen_taxonomy.py, so the two pages cannot drift.

     data-tex is the same operator in the notation the monograph sets it in. It is
     here rather than in the stylesheet or the script because this file is the one

     Lines are kept flat and unindented because the include lands inside a
     markdown="1" container, where indentation is significant.

       the underline sweep; which symbols light is still data-syms on the panels.

       box: its four corner brackets (.op-bk) are inert until JavaScript sets
       .is-framed, so with scripting off nothing of them is visible.

       operator.js (or taxonomy.js through the same `show`), so it starts hidden. -->
