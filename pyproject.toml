[project]
name = "attnbank"
version = "0.1.0"
description = "A modular bank of efficient attention mechanisms organized by what they change"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy", "matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["attnbank*"]
