[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "attnbank"
version = "0.2.0"
description = "A bank of efficient attention mechanisms, organised by what they change and held to one invariant"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ashkan Shahbazi", email = "ashkan.shahbazi@vanderbilt.edu" }]
maintainers = [{ name = "Ashkan Shahbazi", email = "ashkan.shahbazi@vanderbilt.edu" }]
keywords = [
    "attention",
    "transformers",
    "efficient-attention",
    "linear-attention",
    "sparse-attention",
    "kv-cache",
    "kv-cache-compression",
    "state-space-models",
    "optimal-transport",
    "pytorch",
    "benchmark",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
]

[project.optional-dependencies]
# figures: the plotting style module and anything that draws
viz = ["matplotlib>=3.8"]
# reproducing the paper's studies on real activations (GPT-2 / Qwen2.5 capture)
studies = [
    "attnbank[viz]",
    "transformers>=4.44",
    "datasets>=2.19",
    "accelerate>=0.30",
]
# documentation site
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "pymdown-extensions>=10.8",
]
# everything a contributor needs
dev = [
    "attnbank[viz,docs]",
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.5",
]
all = ["attnbank[viz,studies,docs,dev]"]

[project.urls]
Homepage = "https://github.com/attnbank/attnbank"
Documentation = "https://attnbank.github.io/attnbank/"
Repository = "https://github.com/attnbank/attnbank"
Issues = "https://github.com/attnbank/attnbank/issues"
Changelog = "https://github.com/attnbank/attnbank/blob/main/CHANGELOG.md"
"Design contract" = "https://github.com/attnbank/attnbank/blob/main/DESIGN.md"

[tool.setuptools.packages.find]
include = ["attnbank*"]

[tool.setuptools.package-data]
attnbank = ["py.typed", "references.bib"]

# ---------------------------------------------------------------------------
# tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = ["error::DeprecationWarning:attnbank.*"]
markers = [
    "slow: takes more than a few seconds",
    "needs_network: downloads a model or a dataset",
]

# ---------------------------------------------------------------------------
# lint
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E741",    # `l`, `I`, `O` as names: the maths uses single letters on purpose
    "B008",    # function call in a default argument
    "SIM108",  # ternary-vs-if is a readability call, not a rule
    "UP038",   # isinstance(x, (A, B)) is clearer than the PEP 604 form here
    "RUF001",  # ambiguous unicode in docstrings carrying mathematics
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"attnbank/methods/**/*.py" = ["E501"]   # the operator docstrings quote the paper verbatim
"attnbank/studies/**/*.py" = ["E501"]
"tests/**/*.py" = ["E501"]
"examples/**/*.py" = ["E501", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["attnbank"]
