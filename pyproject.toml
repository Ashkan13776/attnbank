[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "attnbank"
version = "0.2.0"
description = "A bank of efficient attention mechanisms, organised by what they change and held to one invariant"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ashkan Shahbazi", email = "ashkan.shahbazi@vanderbilt.edu" }]
maintainers = [{ name = "Ashkan Shahbazi", email = "ashkan.shahbazi@vanderbilt.edu" }]
keywords = [
    "attention",
    "transformers",
    "efficient-attention",
    "linear-attention",
    "sparse-attention",
    "kv-cache",
    "kv-cache-compression",
    "state-space-models",
    "optimal-transport",
    "pytorch",
    "benchmark",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
]

[project.optional-dependencies]
# figures: the plotting style module and anything that draws
viz = ["matplotlib>=3.8"]
# fast execution paths. `reference` and `sdpa` need nothing beyond torch; these are the
# optional kernels. All of them are CUDA-only, so the core install stays CPU-friendly.
flash = ["flash-attn>=2.5"]
triton = ["triton>=2.3"]
xformers = ["xformers>=0.0.26"]
fast = ["attnbank[flash,triton,xformers]"]
# reproducing the paper's studies on real activations (GPT-2 / Qwen2.5 capture)
studies = [
    "attnbank[viz]",
    "transformers>=4.44",
    "datasets>=2.19",
    "accelerate>=0.30",
]
# documentation site
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.25",
    "pymdown-extensions>=10.8",
]
# everything a contributor needs
dev = [
    "attnbank[viz,docs]",
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.5",
]
all = ["attnbank[viz,studies,docs,dev,fast]"]

[project.urls]
Homepage = "https://github.com/attnbank/attnbank"
Documentation = "https://attnbank.github.io/attnbank/"
Repository = "https://github.com/attnbank/attnbank"
Issues = "https://github.com/attnbank/attnbank/issues"
Changelog = "https://github.com/attnbank/attnbank/blob/main/CHANGELOG.md"
"Design contract" = "https://github.com/attnbank/attnbank/blob/main/DESIGN.md"

[tool.setuptools.packages.find]
include = ["attnbank*"]

[tool.setuptools.package-data]
attnbank = ["py.typed", "references.bib"]

# ---------------------------------------------------------------------------
# tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = ["error::DeprecationWarning:attnbank.*"]
markers = [
    "slow: takes more than a few seconds",
    "needs_network: downloads a model or a dataset",
]

# ---------------------------------------------------------------------------
# lint
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["results", "docs/examples/output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM"]
ignore = [
    # the maths uses single letters on purpose: q, k, v, l, I, O
    "E741",
    # a `lambda` inline is often the clearest way to write a one-line map over tensors
    "E731",
    # ternary-vs-if and dict()-vs-{} are readability calls, not rules
    "SIM108",
    "C408",
    # a function call in a default argument is fine for torch dtypes/devices
    "B008",
    # zip(strict=) would be noise on tensors whose shapes the suite already asserts
    "B905",
    # the loop variable of an enumerate used only for its index is idiomatic here
    "B007",
]

[tool.ruff.lint.per-file-ignores]
# Method files quote the paper verbatim; a wrapped equation is worse than a long line.
"attnbank/methods/**/*.py" = ["E501"]
"attnbank/components/**/*.py" = ["E501"]
"tests/**/*.py" = ["E501"]
"examples/**/*.py" = ["E501"]
# The study and plotting modules are executable scripts, not library surface, and they
# are the provenance of every published number: `a = ...; b = ...` for paired tensor
# setup, `del` to free large buffers (which ruff then reads as an unbound name), import
# for side effects, and branch structure kept parallel to the prose it implements.
# Linting them is informative; rewriting them is not worth the risk, so the noisy and
# auto-fixable rules are off here rather than applied.
"attnbank/studies/**/*.py" = ["E501", "E702", "F821", "F401", "C416", "F841", "I001",
                              "SIM114", "SIM102", "SIM103", "SIM110", "SIM118"]
"attnbank/plotting/**/*.py" = ["E501", "E702", "F401", "I001", "SIM114", "SIM102"]

[tool.ruff.lint.isort]
known-first-party = ["attnbank"]
