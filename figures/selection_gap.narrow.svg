<title id="abfig-sel-narrow-t">Top-k selection against output-optimal selection at a matched budget</title>
<desc id="abfig-sel-narrow-d">Two curves of output error against the number of keys kept per query, on logarithmic axes. The upper curve is topk, which keeps the largest attention weights; the lower is value_topk, which keeps the keys that minimise output error. The shaded band between them is the cost of selecting on scores alone, and it does not close as the budget grows.</desc>
