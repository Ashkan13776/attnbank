site_name: attnbank
site_description: >-
  Every efficient attention method, side by side, organised by what it changes --
  and held to one invariant.
site_url: https://Ashkan13776.github.io/attnbank/
repo_url: https://github.com/Ashkan13776/attnbank
repo_name: Ashkan13776/attnbank
edit_uri: edit/main/docs/
copyright: Apache-2.0

# docs/includes holds Markdown/HTML partials pulled in by pymdownx.snippets; they are
# not pages and must not be copied into the built site.
exclude_docs: |
  includes/

theme:
  name: material
  # overrides/partials/source.html drops the header's live GitHub star count, which
  # is the theme's one call to a third-party host.
  custom_dir: overrides
  # Material links fonts.googleapis.com unless this is false. The site makes no
  # third-party requests, so the faces are system stacks; docs/stylesheets/attnbank.css
  # names them.
  font: false
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle: { icon: material/weather-sunny, name: Light mode }
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            # The docstrings are RST and stay RST -- they are read against the
            # monograph. numpy parsing does not translate ``:func:`x``` and friends,
            # so this extension does, reusing gen_methods.strip_roles so the API
            # pages and the generated method pages render a role the same way.
            extensions:
              - docs/griffe_roles.py:SphinxRoles
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            merge_init_into_class: true
            filters: ["!^_"]
            heading_level: 3

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  # :material-xxx: shortcodes. `to_svg` inlines the icon markup; the png and font
  # generators would reach for a CDN, which this site never does.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.arithmatex: { generic: true }

extra_css:
  # everything the site loads is vendored: the front matter and the method browser
  - stylesheets/attnbank.css
  - stylesheets/bank.css

extra_javascript:
  # MathJax 3.2.2, vendored. The SVG build is used rather than CHTML because
  # CHTML pulls ~20 MB of woff2 webfonts, while SVG embeds its glyph outlines
  # in the bundle -- so this one file is the whole dependency and the site
  # makes no third-party requests.  Config must load before the bundle.
  - javascripts/mathjax.js
  - javascripts/tex-svg.js
  - javascripts/bank.js
  - javascripts/attnbank.js

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - The taxonomy: taxonomy.md
  # --- generated by docs/gen_methods.py: do not edit to the end marker ---
  - Browse the bank:
      - methods/index.md
      - exact:
          - Dense softmax attention: methods/softmax.md
          - FlashAttention: methods/flash.md
          - Low-precision attention: methods/lowprec.md
          - Split-K / Flash-Decoding: methods/splitk.md
      - interaction:
          - cosFormer: methods/cosformer.md
          - Linear transformer: methods/linear_elu.md
          - Nystromformer: methods/nystrom.md
          - Performer / FAVOR+: methods/performer.md
          - Random Fourier features for attention: methods/trigrff.md
      - restrict:
          - LSH importance sampling: methods/lsh_sample.md
          - Oracle top-k restriction: methods/topk.md
          - Output-aware selection (oracle): methods/value_topk.md
          - Quest-style page / block selection: methods/blocktopk.md
          - Sliding-window (banded) attention: methods/window.md
          - StreamingLLM: methods/sink_window.md
      - compress:
          - Grouped-query attention: methods/gqa.md
          - H2O: methods/evict_h2o.md
          - Hidden-dimension low rank: methods/lowrank_kv.md
          - KV-cache quantization: methods/quantkv.md
          - Linformer: methods/linformer.md
          - Multi-head latent attention: methods/mla.md
          - SnapKV: methods/evict_snapkv.md
          - Token merging: methods/merge_kv.md
      - factorize:
          - Clustered attention: methods/clustered.md
          - Latent stochastic factorization: methods/latent_stochastic.md
          - Nonnegative rank bound (oracle): methods/nmf_oracle.md
          - Signed rank bound (oracle): methods/svd_oracle.md
      - coupling:
          - LOTFormer-style factored coupling: methods/lowrank_ot.md
          - Sinkhorn / entropic-OT attention: methods/sinkhorn.md
      - recurrent:
          - Decayed linear recurrence: methods/decay_rnn.md
          - DeltaNet: methods/delta_rnn.md
          - Linear attention as a recurrence: methods/linear_rnn.md
  # --- end generated ---
  - The invariant: invariant.md
  - Conformance: conformance.md
  - Backends: backends.md
  - Examples gallery:
      - examples/index.md
      - Quickstart: examples/01_quickstart.md
      - Invariant W: examples/02_the_invariant.md
      - Error decomposition: examples/03_error_decomposition.md
      - Top-k is not optimal: examples/04_topk_is_not_output_optimal.md
      - Random features: examples/05_random_features_converge.md
      - Matrix vs output error: examples/06_matrix_error_is_not_output_error.md
      - Browsing the bank: examples/07_browse_the_bank.md
      - Cost and capacity: examples/08_cost_and_capacity.md
      - Adding a method: examples/09_add_your_own_method.md
      - Backends: examples/10_backends.md
  - API reference:
      - api/index.md
      - Top level: api/top-level.md
      - Core types: api/core.md
      - Metrics: api/metrics.md
      - Conformance: api/conformance.md
      - Errors: api/errors.md
  - Contributing: contributing.md
  - Design contract: design.md
  - Changelog: changelog.md
