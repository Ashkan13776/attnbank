site_name: attnbank
site_description: >-
  Every efficient attention method, side by side, organised by what it changes --
  and held to one invariant.
site_url: https://Ashkan13776.github.io/attnbank/
repo_url: https://github.com/Ashkan13776/attnbank
repo_name: Ashkan13776/attnbank
edit_uri: edit/main/docs/
copyright: Apache-2.0

# Everything under docs/ that is not a page. The snippets partials are pulled in
# by pymdownx.snippets rather than rendered; the generators are build tooling and
# were being published along with their bytecode -- five .py files and a
# __pycache__ served from the live site.
exclude_docs: |
  includes/
  *.py
  __pycache__/

theme:
  name: material
  # overrides/partials/source.html drops the header's live GitHub star count, which
  # is the theme's one call to a third-party host.
  custom_dir: overrides
  # Material links fonts.googleapis.com unless this is false. The site makes no
  # third-party requests, so the faces are system stacks; docs/stylesheets/base.css
  # names them.
  font: false
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle: { icon: material/weather-sunny, name: Light mode }
  icon:
    repo: fontawesome/brands/github

# docs/tex_source.py stamps each display formula's LaTeX source onto its element so
# the copy control can hand it over; MathJax replaces the source with SVG, so this has
# to happen here rather than in the browser.
hooks:
  - docs/tex_source.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            # The docstrings are RST and stay RST -- they are read against the
            # monograph. numpy parsing does not translate ``:func:`x``` and friends,
            # so this extension does, reusing gen_methods.strip_roles so the API
            # pages and the generated method pages render a role the same way.
            extensions:
              - docs/griffe_roles.py:SphinxRoles
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            merge_init_into_class: true
            filters: ["!^_"]
            heading_level: 3

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  # :material-xxx: shortcodes. `to_svg` inlines the icon markup; the png and font
  # generators would reach for a CDN, which this site never does.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.arithmatex: { generic: true }

extra_css:
  # Twelve stylesheets, one per aspect of the site, in cascade order: tokens first
  # because everything reads them, chrome and motion last because they adjust what
  # the others set. lib/SITE_DESIGN.md records who owns which; nobody edits two.
  - stylesheets/tokens.css
  - stylesheets/base.css
  - stylesheets/home.css
  - stylesheets/operator.css
  - stylesheets/taxonomy.css
  - stylesheets/browse.css
  - stylesheets/compare.css
  - stylesheets/method.css
  - stylesheets/gallery.css
  - stylesheets/prose.css
  - stylesheets/chrome.css
  - stylesheets/motion.css

extra_javascript:
  # MathJax 3.2.2, vendored. The SVG build is used rather than CHTML because
  # CHTML pulls ~20 MB of woff2 webfonts, while SVG embeds its glyph outlines
  # in the bundle -- so this one file is the whole dependency and the site
  # makes no third-party requests.  Config must load before the bundle.
  - javascripts/mathjax.js
  - javascripts/tex-svg.js
  - javascripts/bank.js
  # operator.js publishes window.AttnOperator; taxonomy.js consumes it.
  - javascripts/operator.js
  - javascripts/taxonomy.js
  - javascripts/clip.js
  - javascripts/motion.js

